<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PL-purple tile background -->
  <rect width="64" height="64" rx="12" fill="#38003c"/>
  <!-- ball -->
  <circle cx="32" cy="32" r="23" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <!-- central pentagon -->
  <polygon points="32,23 23.4,29.2 26.7,39.3 37.3,39.3 40.6,29.2" fill="#1a1a2e"/>
  <!-- seams from pentagon vertices to the ball edge -->
  <g stroke="#1a1a2e" stroke-width="2" stroke-linecap="round">
    <line x1="32"   y1="23"   x2="32"   y2="10"/>
    <line x1="23.4" y1="29.2" x2="11.1" y2="25.2"/>
    <line x1="26.7" y1="39.3" x2="19.1" y2="49.8"/>
    <line x1="37.3" y1="39.3" x2="44.9" y2="49.8"/>
    <line x1="40.6" y1="29.2" x2="52.9" y2="25.2"/>
  </g>
  <!-- partial edge pentagons where the seams meet the silhouette -->
  <g stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M25 10.6 L32 10 L39 10.6"/>
    <path d="M9.8 32.5 L11.1 25.2 L16.3 20"/>
    <path d="M12.9 45 L19.1 49.8 L26.5 54.3"/>
    <path d="M51.1 45 L44.9 49.8 L37.5 54.3"/>
    <path d="M54.2 32.5 L52.9 25.2 L47.7 20"/>
  </g>
</svg>
